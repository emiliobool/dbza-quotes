# Cloudflare Pages config (used by `npm run pages:dev` and CI deploys).
name = "dbza-quotes"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# After creating the D1 database, uncomment and fill in:
#   npx wrangler d1 create dbza-quotes
#   npx wrangler d1 execute dbza-quotes --remote --file db/schema.sql
#
# [[d1_databases]]
# binding = "DB"
# database_name = "dbza-quotes"
# database_id = "REPLACE_ME"

# Secrets (set in the Pages dashboard or `wrangler pages secret put`):
#   ADMIN_TOKEN      — bearer token for /api/queue*
#   TURNSTILE_SECRET — enables Turnstile verification on /api/submit
#   IP_SALT          — random string for hashing submitter IPs
# Vars:
#   MAX_DAILY        — daily submission cap before the queue closes (default 500)
